name: Code Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A new push to a PR cancels that PR's older run. On master a running run is
# never cancelled, but a newer push replaces one still waiting to start.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run type check
        run: yarn type-check

      - name: Run linting
        run: yarn lint

      - name: Check formatting
        run: yarn format:check

      # No secrets or database variables here: tests run against a mocked
      # Prisma client, and src/tests/setup.ts blocks any real connection.
      - name: Run unit tests
        run: yarn test

      # Placeholders, not secrets: the build passes with none of these set and
      # opens no database connection (checked 2026-11-12, no .env). The
      # .invalid host makes any future build-time query fail instead of
      # reaching a real database.
      - name: Build
        run: yarn build
        env:
          DATABASE_URL: postgresql://ci:ci@db.invalid:5432/ci
          DIRECT_URL: postgresql://ci:ci@db.invalid:5432/ci
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-build-placeholder
          GOOGLE_CLIENT_ID: ci-build-placeholder
          GOOGLE_CLIENT_SECRET: ci-build-placeholder
          NEXT_TELEMETRY_DISABLED: 1
